name: CI - AML Transaction Monitoring

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests (Python/FastAPI)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      
      - name: Run mypy type checking
        run: |
          python -m mypy app --ignore-missing-imports --check-untyped-defs
        continue-on-error: false
      
      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html
        continue-on-error: false
      
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/htmlcov/
      
      - name: Check migration parity
        run: |
          rm -f ./_migration_check.db
          DATABASE_URL=sqlite:///./_migration_check.db python -m alembic upgrade head
          rm -f ./_migration_check.db
  
  frontend-tests:
    name: Frontend Tests (React/TypeScript)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type check
        run: npx tsc --noEmit
      
      - name: Run frontend unit tests
        run: CI=true npm test
        env:
          CI: true
      
      - name: Build frontend
        run: npm run build
  
  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run database migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./test_e2e.db
      
      - name: Seed test database
        working-directory: backend
        run: |
          python app/seed.py
        env:
          DATABASE_URL: sqlite:///./test_e2e.db
      
      - name: Start backend server
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 9000 &
          echo $! > backend.pid
          sleep 5
        env:
          DATABASE_URL: sqlite:///./test_e2e.db
      
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm run dev -- --port 5173 &
          echo $! > frontend.pid
          sleep 10
      
      - name: Wait for servers to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:9000/health; do sleep 2; done'
          timeout 30 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'
      
      - name: Run Playwright e2e tests - Full Flow
        run: npx playwright test e2e/journey_full_flow.spec.ts --reporter=list
        env:
          BASE_URL: http://localhost:5173
      
      - name: Run Playwright e2e tests - Blocked Decision
        run: npx playwright test e2e/journey_blocked_decision.spec.ts --reporter=list
        env:
          BASE_URL: http://localhost:5173
      
      - name: Run all Playwright e2e tests
        run: npx playwright test --reporter=list
        env:
          BASE_URL: http://localhost:5173
      
      - name: Stop servers
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi
          if [ -f frontend/frontend.pid ]; then
            kill $(cat frontend/frontend.pid) || true
          fi
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
      
      - name: Run ruff linter (Python)
        working-directory: backend
        run: |
          python -m ruff check app/ tests/ || true
        continue-on-error: true
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run ESLint (TypeScript/React)
        working-directory: frontend
        run: npm run lint || true
        continue-on-error: true
